# Pipeline de redes: renderiza piezas, publica las aprobadas y trae métricas.
# Secretos: CLOUDFLARE_API_TOKEN (ya existe), GEMINI_API_KEY, META_PAGE_TOKEN, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
name: Redes
on:
  push:
    branches: [main]
    paths: ['.github/mkt/semanas/**', '.github/mkt/*.py', '.github/mkt/*.sh', '.github/workflows/mkt.yml']
  schedule:
    - cron: '7 * * * *'     # publicar (cada hora)
    - cron: '20 10 * * *'   # métricas (5:20 a. m. Colombia)
    - cron: '0 2 * * 4'     # competencia en YouTube (miércoles 9 p. m. Colombia)
  workflow_dispatch:
    inputs:
      tarea: { description: 'render | publicar | metricas | personajes | competencia | todo', default: 'todo' }
      simular: { description: 'publicar sin enviar (true/false)', default: 'false' }
concurrency: { group: "redes-${{ (github.event.schedule == '20 10 * * *' || github.event.schedule == '0 2 * * 4') && 'lectura' || 'publicar' }}", cancel-in-progress: false }
permissions: { contents: write }
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 85f7056427611b1d4b8733ca46c69ba8
  R2: radionovelas-audio
  PUBLICO: https://audio.radionovelasdeayer.com
jobs:
  redes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Qué toca
        id: toca
        run: |
          T="${{ github.event.inputs.tarea }}"
          E="${{ github.event_name }}"; S="${{ github.event.schedule }}"
          R=false; P=false; M=false; H=false; C=false
          if [ "$E" = push ]; then R=true; P=true; fi
          if [ "$E" = schedule ] && [ "$S" = '7 * * * *' ]; then P=true; fi
          if [ "$E" = schedule ] && [ "$S" = '20 10 * * *' ]; then M=true; fi
          if [ "$E" = schedule ] && [ "$S" = '0 2 * * 4' ]; then C=true; fi
          if [ "$E" = workflow_dispatch ]; then
            case "$T" in render) R=true;; publicar) P=true;; metricas) M=true;; personajes) H=true;; competencia) C=true;; *) R=true; P=true; M=true;; esac
          fi
          echo "render=$R" >> $GITHUB_OUTPUT; echo "publicar=$P" >> $GITHUB_OUTPUT; echo "metricas=$M" >> $GITHUB_OUTPUT; echo "personajes=$H" >> $GITHUB_OUTPUT; echo "competencia=$C" >> $GITHUB_OUTPUT
          echo "render=$R publicar=$P metricas=$M"
      - name: Dependencias
        run: |
          pip install -q pillow
          if [ "${{ steps.toca.outputs.render }}" = true ]; then sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null; fi
      - name: Renderizar piezas nuevas o cambiadas
        if: steps.toca.outputs.render == 'true'
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: .github/mkt/ciclo.sh render
      - name: Hojas de personaje pendientes
        if: steps.toca.outputs.personajes == 'true'
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: .github/mkt/ciclo.sh personajes
      - name: Vistas previas a la rama mkt-medios
        if: always() && (steps.toca.outputs.render == 'true' || steps.toca.outputs.personajes == 'true')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: .github/mkt/ciclo.sh previas
      - name: Bajar estado
        id: bajar
        if: always() && (steps.toca.outputs.publicar == 'true' || steps.toca.outputs.metricas == 'true')
        run: .github/mkt/ciclo.sh bajar
      - name: Publicar aprobadas
        if: always() && steps.bajar.outcome == 'success' && steps.toca.outputs.publicar == 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SIMULAR: ${{ github.event.inputs.simular }}
        run: .github/mkt/ciclo.sh publicar
      - name: Métricas
        if: always() && steps.bajar.outcome == 'success' && steps.toca.outputs.metricas == 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: .github/mkt/ciclo.sh metricas
      - name: Competencia (YouTube)
        if: always() && steps.toca.outputs.competencia == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: .github/mkt/ciclo.sh competencia
